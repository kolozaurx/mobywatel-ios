name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show Package.swift contents
        run: |
          echo "=== Root Package.swift ==="
          cat Package.swift || echo "brak"
          echo "=== App/Package.swift ==="
          cat App/Package.swift || echo "brak"
          echo "=== Wszystkie Package.swift ==="
          find . -name "Package.swift" -exec echo "--- {} ---" \; -exec cat {} \;

      - name: Fix Swift tools version
        run: |
          find . -name "Package.swift" | while read f; do
            echo "Patching $f"
            sed -i '' 's|// swift-tools-version:.*|// swift-tools-version: 5.9|' "$f"
          done

      - name: List schemes
        run: |
          if [ -f "App/Package.swift" ]; then
            cd App && xcodebuild -list 2>&1
          else
            xcodebuild -list 2>&1
          fi

      - name: Build FULL output
        run: |
          set -o pipefail
          if [ -f "App/Package.swift" ]; then
            cd App
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath ../build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1
          else
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1
          fi

      - name: Find all build artifacts
        if: always()
        run: |
          echo "=== Wszystkie pliki .app ==="
          find . -name "*.app" -type d 2>/dev/null || echo "brak .app"
          echo "=== Struktura build/ ==="
          find build/ -maxdepth 5 -type d 2>/dev/null || echo "brak build/"
          echo "=== Struktura .build/ ==="
          find .build/ -maxdepth 5 -type d 2>/dev/null || echo "brak .build/"
