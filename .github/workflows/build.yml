name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Fix Swift tools version
        run: |
          for f in $(find . -name "Package.swift"); do
            sed -i '' 's|// swift-tools-version:.*|// swift-tools-version: 5.9|' "$f" || \
            sed -i    's|// swift-tools-version:.*|// swift-tools-version: 5.9|' "$f"
          done

      - name: Build
        run: |
          if [ -f "App/Package.swift" ]; then
            cd App
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath ../build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1 | tail -80
          else
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1 | tail -80
          fi

      - name: Find app bundle
        run: |
          echo "=== Szukam .app ==="
          find . -name "*.app" -type d 2>/dev/null
          echo "=== Zawartość build/ ==="
          find build/ -type d | head -30 || echo "brak folderu build/"

      - name: Package as IPA
        run: |
          APP=$(find . -name "*.app" -type d | grep -v ".xcodeproj" | head -1)
          echo "Found app: $APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r mObywatel.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mObywatel-ipa
          path: mObywatel.ipa
          retention-days: 30
