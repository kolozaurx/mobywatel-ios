name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show project structure
        run: find . -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Package.swift" | head -20

      - name: Build IPA (unsigned)
        run: |
          PROJECT=$(find . -name "*.xcodeproj" | head -1)
          echo "Found project: $PROJECT"
          xcodebuild \
            -project "$PROJECT" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package as IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "Found app: $APP"
          cp -r "$APP" Payload/
          zip -r mObywatel.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mObywatel-ipa
          path: mObywatel.ipa
          retention-days: 30
