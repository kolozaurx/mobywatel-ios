name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show all files
        run: |
          echo "=== ROOT ==="
          ls -la
          echo "=== App/ ==="
          ls -la App/ || echo "brak"
          echo "=== Sources/ ==="
          ls -la Sources/ || echo "brak"
          echo "=== Package.swift (root) ==="
          cat Package.swift || echo "brak"
          echo "=== Package.swift (App/) ==="
          cat App/Package.swift || echo "brak"

      - name: Fix Swift tools version
        run: |
          for f in $(find . -name "Package.swift"); do
            echo "Patching $f"
            sed -i '' 's|// swift-tools-version:.*|// swift-tools-version: 5.9|' "$f" || \
            sed -i    's|// swift-tools-version:.*|// swift-tools-version: 5.9|' "$f"
          done

      - name: Build
        run: |
          # Próbuj w App/ jeśli tam jest Package.swift
          if [ -f "App/Package.swift" ]; then
            cd App
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath ../build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1 | tail -80
          else
            xcodebuild \
              -scheme mObywatel \
              -sdk iphoneos \
              -configuration Release \
              -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO \
              ONLY_ACTIVE_ARCH=NO \
              build 2>&1 | tail -80
          fi

      - name: List schemes (debug jeśli błąd)
        if: failure()
        run: |
          echo "=== Dostępne schematy ==="
          if [ -f "App/Package.swift" ]; then
            cd App && xcodebuild -list 2>&1
          else
            xcodebuild -list 2>&1
          fi

      - name: Package as IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "Found app: $APP"
          cp -r "$APP" Payload/
          zip -r mObywatel.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mObywatel-ipa
          path: mObywatel.ipa
          retention-days: 30
