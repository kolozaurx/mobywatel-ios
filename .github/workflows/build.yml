name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Build IPA (unsigned)
        run: |
          xcodebuild \
            -scheme mObywatel \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package as IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r mObywatel.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mObywatel-ipa
          path: mObywatel.ipa
          retention-days: 30
