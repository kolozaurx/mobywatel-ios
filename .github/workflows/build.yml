name: Build IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== App folder ==="
          ls -la App/ || echo "brak folderu App"
          echo "=== Sources folder ==="
          ls -la Sources/ || echo "brak folderu Sources"
          find . -name "Package.swift" | head -10
          find . -name "*.xcodeproj" | head -10
          find . -name "*.xcworkspace" | head -10

      - name: Build with xcodebuild (Swift Package)
        run: |
          cd App
          xcodebuild \
            -scheme mObywatel \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath ../build \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | tail -50

      - name: Package as IPA
        run: |
          mkdir -p Payload
          APP=$(find build/Build/Products/Release-iphoneos -name "*.app" | head -1)
          echo "Found app: $APP"
          cp -r "$APP" Payload/
          zip -r mObywatel.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: mObywatel-ipa
          path: mObywatel.ipa
          retention-days: 30
